<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | KIDVERSE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { 'brand-blue': '#2563EB', 'brand-blue-dark': '#1D4ED8' }}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-3 mb-4">
        <div class="w-12 h-12 bg-gradient-to-br from-brand-blue to-purple-600 rounded-xl flex items-center justify-center text-white text-xl font-bold">K</div>
        <span class="text-2xl font-bold text-gray-900">KIDVERSE</span>
      </a>
      <h1 class="text-2xl font-bold text-gray-900">Connexion</h1>
      <p class="text-gray-500">Accédez à votre espace garderie</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input type="email" placeholder="votre@email.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-transparent">
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2">
            <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-brand-blue focus:ring-brand-blue">
            <span class="text-sm text-gray-600">Se souvenir de moi</span>
          </label>
          <a href="forgot-password.html" class="text-sm text-brand-blue hover:underline">Mot de passe oublié?</a>
        </div>
        <a href="dashboard.html" class="block w-full py-3 bg-brand-blue text-white text-center rounded-xl font-semibold hover:bg-brand-blue-dark transition-colors">
          Se connecter
        </a>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-500">Pas encore de compte?</p>
        <a href="register.html" class="text-brand-blue font-medium hover:underline">Créer un compte</a>
      </div>
    </div>

    <p class="text-center text-gray-400 text-sm mt-6">
      © 2024 KIDVERSE - Tous droits réservés
    </p>
  </div>
</body>
</html>
