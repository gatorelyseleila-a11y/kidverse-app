<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription | KIDVERSE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { 'brand-blue': '#2563EB', 'brand-blue-dark': '#1D4ED8' }}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-3 mb-4">
        <div class="w-12 h-12 bg-gradient-to-br from-brand-blue to-purple-600 rounded-xl flex items-center justify-center text-white text-xl font-bold">K</div>
        <span class="text-2xl font-bold text-gray-900">KIDVERSE</span>
      </a>
      <h1 class="text-2xl font-bold text-gray-900">Créer un compte</h1>
      <p class="text-gray-500">Rejoignez KIDVERSE</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form class="space-y-5">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Prénom</label>
            <input type="text" placeholder="Jean" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Nom</label>
            <input type="text" placeholder="Dupont" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input type="email" placeholder="votre@email.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Type de compte</label>
          <select class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue">
            <option>Parent</option>
            <option>Éducateur</option>
            <option>Directeur</option>
          </select>
        </div>
        <a href="dashboard.html" class="block w-full py-3 bg-brand-blue text-white text-center rounded-xl font-semibold hover:bg-brand-blue-dark transition-colors">
          Créer mon compte
        </a>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-500">Déjà un compte?</p>
        <a href="login.html" class="text-brand-blue font-medium hover:underline">Se connecter</a>
      </div>
    </div>
  </div>
</body>
</html>
