<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enfants | KIDVERSE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { 'brand-blue': '#2563EB', 'brand-blue-dark': '#1D4ED8' }}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50">
  <script src="../js/navigation.js"></script>
  
  <main class="p-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <nav class="text-sm text-gray-500 mb-2">
          <a href="../index.html" class="hover:text-brand-blue">Accueil</a> / 
          <span class="text-gray-900">Enfants</span>
        </nav>
        <h1 class="text-2xl font-bold text-gray-900">Liste des enfants</h1>
        <p class="text-gray-500">Gérez les dossiers des enfants inscrits</p>
      </div>
      <a href="children-new.html" class="inline-flex items-center gap-2 px-4 py-2.5 bg-brand-blue text-white rounded-xl font-medium hover:bg-brand-blue-dark transition-colors">
        <i class="fas fa-plus"></i>
        Nouvel enfant
      </a>
    </div>

    <!-- Search & Filters -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex-1 relative">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" placeholder="Rechercher un enfant..." class="w-full pl-12 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue">
        </div>
        <select class="px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl">
          <option>Tous les groupes</option>
          <option>Les Explorateurs</option>
          <option>Les Aventuriers</option>
        </select>
      </div>
    </div>

    <!-- Children Grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
      <a href="children-profile.html" class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition-all">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-full bg-gradient-to-br from-pink-400 to-purple-500 flex items-center justify-center text-white text-xl font-bold">E</div>
          <div>
            <h3 class="font-semibold text-gray-900">Emma Dupont</h3>
            <p class="text-sm text-gray-500">3 ans • Les Explorateurs</p>
            <span class="inline-flex items-center gap-1 text-xs text-green-600 mt-1">
              <span class="w-2 h-2 bg-green-500 rounded-full"></span>
              Présente
            </span>
          </div>
        </div>
      </a>
      <a href="children-profile.html" class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition-all">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-full bg-gradient-to-br from-blue-400 to-cyan-500 flex items-center justify-center text-white text-xl font-bold">L</div>
          <div>
            <h3 class="font-semibold text-gray-900">Lucas Martin</h3>
            <p class="text-sm text-gray-500">4 ans • Les Aventuriers</p>
            <span class="inline-flex items-center gap-1 text-xs text-green-600 mt-1">
              <span class="w-2 h-2 bg-green-500 rounded-full"></span>
              Présent
            </span>
          </div>
        </div>
      </a>
      <a href="children-profile.html" class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition-all">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white text-xl font-bold">T</div>
          <div>
            <h3 class="font-semibold text-gray-900">Thomas Roy</h3>
            <p class="text-sm text-gray-500">2 ans • Les Bambins</p>
            <span class="inline-flex items-center gap-1 text-xs text-gray-400 mt-1">
              <span class="w-2 h-2 bg-gray-300 rounded-full"></span>
              Absent
            </span>
          </div>
        </div>
      </a>
    </div>
  </main>

  <script>initNavigation('children', 'Enfants', 'Gestion');</script>
</body>
</html>
