version: '3.8'

services:
  # ===========================================
  # Base de données PostgreSQL
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: kidverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kidverse
      POSTGRES_PASSWORD: kidverse_password
      POSTGRES_DB: kidverse_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidverse -d kidverse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis (Cache & Sessions)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: kidverse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # MinIO (Stockage S3-compatible)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: kidverse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_access_key
      MINIO_ROOT_PASSWORD: minio_secret_key
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===========================================
  # API Backend (NestJS)
  # ===========================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kidverse-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://kidverse:kidverse_password@postgres:5432/kidverse_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio_access_key
      S3_SECRET_KEY: minio_secret_key
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Frontend Web (Next.js)
  # ===========================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kidverse-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-in-production}
    ports:
      - "3000:3000"

  # ===========================================
  # Adminer (Interface DB - Dev uniquement)
  # ===========================================
  adminer:
    image: adminer:latest
    container_name: kidverse-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: kidverse-network


